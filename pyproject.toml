[project]
name = "mcp-hotels"
version = "0.1.0"
description = "Demo hotel-search MCP server built to survive AI traffic spikes (mock data only)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "redis>=5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
mcp-hotels = "mcp_server.server:main"

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.40.0",
    "locust>=2.47.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["supplier", "mcp_server", "dashboard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
