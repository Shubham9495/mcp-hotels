# All services use mock data only. Ports: MCP 8000, supplier 8001, dashboard 8002, Redis 6379.
x-app: &app
  build: .
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    REDIS_URL: redis://redis:6379/0
    SUPPLIER_URL: http://supplier:8001
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  supplier:
    <<: *app
    command: uvicorn supplier.app:app --host 0.0.0.0 --port 8001
    ports: ["8001:8001"]

  mcp:
    <<: *app
    command: mcp-hotels --http
    environment:
      REDIS_URL: redis://redis:6379/0
      SUPPLIER_URL: http://supplier:8001
      MCP_HTTP_HOST: 0.0.0.0
      MCP_WORKERS: ${MCP_WORKERS:-4}
    ports: ["8000:8000"]

  dashboard:
    <<: *app
    command: uvicorn dashboard.app:app --host 0.0.0.0 --port 8002
    ports: ["8002:8002"]

  # `make spike` - runs only when asked (profile), inside the Docker network.
  loadtest:
    image: locustio/locust:2.47.0
    profiles: ["loadtest"]
    volumes: ["./loadtest:/mnt/locust:ro"]
    environment:
      SPIKE_USERS: ${SPIKE_USERS:-500}
      SPIKE_RAMP_S: ${SPIKE_RAMP_S:-20}
      SPIKE_HOLD_S: ${SPIKE_HOLD_S:-60}
    command: >
      -f /mnt/locust/locustfile.py --headless --host http://mcp:8000
      --only-summary --stop-timeout 5
    depends_on: [mcp]

  # `make tunnel` - public HTTPS URL for using the server as a Claude custom connector.
  # Runs inside Docker so traffic to the MCP server never leaves the Docker network.
  # Quick tunnel: no Cloudflare account needed, new random hostname on every start.
  # The Host header is rewritten to mcp:8000 so the server's DNS-rebinding check accepts it.
  # NO AUTHENTICATION: anyone with the URL can call the (mock) tools. Stop it when done.
  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    profiles: ["tunnel"]
    restart: "no"
    command: tunnel --no-autoupdate --url http://mcp:8000 --http-host-header mcp:8000
    # Trust the system roots plus any extra root CAs in docker/extra-ca/ (needed when antivirus
    # or a corporate proxy inspects HTTPS; harmless otherwise).
    environment:
      SSL_CERT_DIR: /etc/ssl/certs:/extra-ca
    volumes: ["./docker/extra-ca:/extra-ca:ro"]
    depends_on: [mcp]
